project:
  type: book
  output-dir: _book

book:
  title: "예측 모델을 넘어 자율 에이전트로"
  subtitle: "데이터 사이언티스트를 위한 하이브리드 AI 아키텍처와 신뢰성 공학"
  author: "김지웅"
  date: today
  repo-url: https://github.com/jiwoongme/compound-ai-book
  repo-actions: [edit, issue]
  page-navigation: true
  search: true
  
  chapters:
    - index.qmd
    - part: "Part 1. 단일 모델에서 복합 AI 시스템으로"
      chapters:
        - part1/post01_why_compound_ai.qmd
    # 추후 연재에 맞춰 아래 주석을 하나씩 해제하며 추가합니다.
    # - part: "Part 2. Agent-Ready Data와 스키마 공학"
    # - part: "Part 3. 예측·이상탐지 모델과 에이전트 결합"
    # - part: "Part 4. Agent Evals & 신뢰성 공학"
    - references.qmd

execute:
  freeze: auto      # 로컬 실행 결과를 캐싱하여 CI/CD 빌드 시 API 재호출 방지
  echo: true        # 본문에 코드 블록 표시
  warning: false    # 불필요한 파이썬 경고 메시지 숨김

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    code-copy: true
    code-fold: false
    toc: true
    toc-depth: 3
    number-sections: true
  docx:
    toc: true
    number-sections: true
    highlight-style: github